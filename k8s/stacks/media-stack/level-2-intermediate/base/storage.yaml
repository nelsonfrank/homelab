# ==============================================================================
# Shared Media Library Volume (ReadWriteMany)
# In Level 2, this is provisioned dynamically via a ReadWriteMany (RWX)
# StorageClass (e.g. NFS CSI, TrueNAS CSI, or CephFS)
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-media-data
  namespace: media
  labels:
    app.kubernetes.io/part-of: media-stack
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nfs-client # Can be patched in overlays
  resources:
    requests:
      storage: 2Ti
---
# ==============================================================================
# Dedicated Application Config PVCs (ReadWriteOnce)
# Used for SQLite databases and config files.
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashy-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
