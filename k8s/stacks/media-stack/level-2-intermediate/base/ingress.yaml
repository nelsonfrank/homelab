apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: media-stack-ingress
  namespace: media
  labels:
    app.kubernetes.io/part-of: media-stack
  annotations:
    kubernetes.io/ingress.class: "traefik" # or "nginx"
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
    # nginx.ingress.kubernetes.io/proxy-body-size: "1000m"
spec:
  rules:
    - host: dashy.home.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashy
                port:
                  number: 8080
    - host: qbit.home.lab
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
