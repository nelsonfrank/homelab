apiVersion: apps/v1
kind: Deployment
metadata:
  name: qui
  namespace: media
  labels:
    app.kubernetes.io/name: qui
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: qui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qui
        app.kubernetes.io/part-of: media-stack
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: qui
          image: ghcr.io/autobrr/qui:latest
          ports:
            - name: http
              containerPort: 7476
          readinessProbe:
            httpGet:
              path: /
              port: 7476
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 7476
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: qui-config
---
apiVersion: v1
kind: Service
metadata:
  name: qui
  namespace: media
  labels:
    app.kubernetes.io/name: qui
    app.kubernetes.io/part-of: media-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: qui
  ports:
    - name: http
      port: 7476
      targetPort: 7476
