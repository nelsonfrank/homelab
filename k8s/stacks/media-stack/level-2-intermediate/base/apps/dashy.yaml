apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashy
  namespace: media
  labels:
    app.kubernetes.io/name: dashy
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dashy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashy
        app.kubernetes.io/part-of: media-stack
    spec:
      securityContext:
        runAsUser: 568
        runAsGroup: 568
        fsGroup: 568
      containers:
        - name: dashy
          image: lissy93/dashy:latest
          env:
            - name: NODE_ENV
              value: "production"
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /app/user-data/
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: dashy-config
---
apiVersion: v1
kind: Service
metadata:
  name: dashy
  namespace: media
  labels:
    app.kubernetes.io/name: dashy
    app.kubernetes.io/part-of: media-stack
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: dashy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
