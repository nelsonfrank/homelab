apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: media

resources:
  - ../../base

patches:
  - path: patches/storageclass-patch.yaml

configMapGenerator:
  - name: media-common-env
    behavior: replace
    envs:
      - common.env

secretGenerator:
  - name: media-secrets
    behavior: replace
    envs:
      - secrets.env.example
