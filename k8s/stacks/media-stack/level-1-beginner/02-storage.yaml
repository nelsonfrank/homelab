# ==============================================================================
# Shared Media Data Storage (RWX - ReadWriteMany)
# In Level 1, a hostPath PersistentVolume is used.
# If your cluster has a default StorageClass (e.g., local-path on K3s),
# the PVC can use that instead.
# ==============================================================================
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-media-data
  labels:
    type: local-storage
    app.kubernetes.io/part-of: media-stack
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    # Set this to the directory on your host where movies/tv/downloads reside
    path: /mnt/storage/media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-media-data
  namespace: media
  labels:
    app.kubernetes.io/part-of: media-stack
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Ti
  volumeName: pv-media-data
---
# ==============================================================================
# Application Configurations (RWO - ReadWriteOnce)
# Each application has its own dedicated config PVC for SQLite databases & settings.
# ==============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dashy-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
