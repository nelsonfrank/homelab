apiVersion: apps/v1
kind: Deployment
metadata:
  name: stremio-server
  namespace: media
  labels:
    app.kubernetes.io/name: stremio-server
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stremio-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stremio-server
        app.kubernetes.io/part-of: media-stack
    spec:
      containers:
        - name: stremio-server
          image: stremio/server:latest
          env:
            - name: NO_CORS
              value: "1"
          ports:
            - name: http
              containerPort: 11470
            - name: https
              containerPort: 12470
          volumeMounts:
            - name: data
              mountPath: /root/.stremio-server
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: stremio-data
---
apiVersion: v1
kind: Service
metadata:
  name: stremio-server
  namespace: media
  labels:
    app.kubernetes.io/name: stremio-server
    app.kubernetes.io/part-of: media-stack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: stremio-server
  ports:
    - name: http
      port: 11470
      targetPort: 11470
      nodePort: 31470
    - name: https
      port: 12470
      targetPort: 12470
      nodePort: 31471
