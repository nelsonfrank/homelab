apiVersion: apps/v1
kind: Deployment
metadata:
  name: profilarr
  namespace: media
  labels:
    app.kubernetes.io/name: profilarr
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: profilarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profilarr
        app.kubernetes.io/part-of: media-stack
    spec:
      containers:
        - name: profilarr
          image: santiagosayshey/profilarr:latest
          envFrom:
            - configMapRef:
                name: media-common-env
          ports:
            - name: http
              containerPort: 6868
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: profilarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: profilarr
  namespace: media
  labels:
    app.kubernetes.io/name: profilarr
    app.kubernetes.io/part-of: media-stack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: profilarr
  ports:
    - name: http
      port: 6868
      targetPort: 6868
      nodePort: 30686
