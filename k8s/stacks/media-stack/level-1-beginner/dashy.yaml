apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashy
  namespace: media
  labels:
    app.kubernetes.io/name: dashy
    app.kubernetes.io/part-of: media-stack
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dashy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashy
        app.kubernetes.io/part-of: media-stack
    spec:
      containers:
        - name: dashy
          image: lissy93/dashy:latest
          env:
            - name: NODE_ENV
              value: "production"
            - name: UID
              value: "568"
            - name: GID
              value: "568"
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /app/user-data/
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: dashy-config
---
apiVersion: v1
kind: Service
metadata:
  name: dashy
  namespace: media
  labels:
    app.kubernetes.io/name: dashy
    app.kubernetes.io/part-of: media-stack
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: dashy
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30400
