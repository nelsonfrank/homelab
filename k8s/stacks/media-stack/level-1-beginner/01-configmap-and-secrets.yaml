apiVersion: v1
kind: ConfigMap
metadata:
  name: media-common-env
  namespace: media
  labels:
    app.kubernetes.io/part-of: media-stack
data:
  # General timezone and user permission IDs
  TZ: "America/New_York"
  TIMEZONE: "America/New_York"
  PUID: "1000"
  PGID: "1000"
---
apiVersion: v1
kind: Secret
metadata:
  name: media-secrets
  namespace: media
  labels:
    app.kubernetes.io/part-of: media-stack
type: Opaque
stringData:
  # Replace these with your actual API keys generated in Sonarr/Radarr Web UIs
  SONARR_API_KEY: "replace_with_your_sonarr_api_key"
  RADARR_API_KEY: "replace_with_your_radarr_api_key"
